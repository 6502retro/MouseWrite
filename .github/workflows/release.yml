# Publishes a GitHub release when a version tag (v*) is pushed.
# The notes come from .github/release-notes/<tag>.md.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "MouseWrite ${GITHUB_REF_NAME#v}" \
            --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"
