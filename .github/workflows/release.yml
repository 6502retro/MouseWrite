# Publishes a GitHub release for every .github/release-notes/<tag>.md on main
# that doesn't have one yet (the tag is created at the pushed commit).
# To release: add .github/release-notes/vX.Y.md and push it to main.
name: Release
on:
  push:
    branches: [main]
    paths: ['.github/release-notes/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for notes in .github/release-notes/v*.md; do
            tag=$(basename "$notes" .md)
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already released"
            else
              gh release create "$tag" --target "$GITHUB_SHA" \
                --title "MouseWrite ${tag#v}" --notes-file "$notes"
            fi
          done
